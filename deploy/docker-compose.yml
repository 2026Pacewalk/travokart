# Travokart — app service for a Hostinger "Docker + Traefik" VPS.
# Hostinger already runs Traefik (host network, certresolver "letsencrypt",
# entrypoints web/websecure). We just publish our app and let that Traefik
# route travokart.com to it over HTTPS. App data (D1 + R2 uploads) persists
# in the `app_state` volume.
#
# Deploy:  cd deploy && cp .env.example .env && nano .env
#          docker compose up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: travokart_app
    restart: unless-stopped
    environment:
      - PORT=8080
      - NODE_ENV=development
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - app_state:/app/.wrangler
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=travokart_web
      - traefik.http.routers.travokart.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.travokart.entrypoints=websecure
      - traefik.http.routers.travokart.tls.certresolver=letsencrypt
      - traefik.http.services.travokart.loadbalancer.server.port=8080

volumes:
  app_state:

networks:
  web:
    name: travokart_web
